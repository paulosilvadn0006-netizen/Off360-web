crons:
  # PRODUÇÃO: a auto-aprovação é disparada pelo cron-job.org (mesmo endpoint seguro).
  # Este arquivo serve apenas ao PREVIEW/testes (cadências <15min são descartadas em prod).
  - name: autoapprove-boosts
    description: "PREVIEW/testes: aprova Destaques seguros ~2min apos envio. Em producao quem dispara e o cron-job.org (endpoint identico)"
    cron: "*/1 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/auto-approve-boosts"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: merchant-daily-sum
    description: "Envia por e-mail o resumo diario (faturamento, comandas, item mais vendido) a cada empresario"
    cron: "0 0 * * *"
    timezone: "America/Sao_Paulo"
    endpoint: "{{BASE_URL}}/api/cron/merchant-daily-summary"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: taxi-sub-reminder
    description: "Avisa motoristas 3 dias antes do vencimento da assinatura 360Taxi (app + e-mail)"
    cron: "0 12 * * *"
    endpoint: "{{BASE_URL}}/api/cron/taxi-subscription-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: backfill-coords
    description: "Geocodifica diariamente (03:00 America/Sao_Paulo) novos parceiros OFF360 sem lat/lng"
    cron: "0 3 * * *"
    timezone: "America/Sao_Paulo"
    endpoint: "{{BASE_URL}}/api/cron/backfill-coordinates"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: insurance-checks
    description: "Seguro APP MBM: lembra motoristas sem apolice anexada e avisa/expira apolices anuais (30 dias antes / no vencimento)"
    cron: "0 12 * * *"
    timezone: "America/Sao_Paulo"
    endpoint: "{{BASE_URL}}/api/cron/insurance-checks"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: merchant-sub-checks
    description: "Empresarios OFF360: lembra 3 dias antes do vencimento mensal (R$ 89,90) e reabre o muro de pagamento quando vence"
    cron: "0 12 * * *"
    timezone: "America/Sao_Paulo"
    endpoint: "{{BASE_URL}}/api/cron/merchant-subscription-checks"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
